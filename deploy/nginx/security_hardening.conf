# ==============================================================================
# NEO Network — Nginx Buffer & Overflow Shield
# ==============================================================================

# 1. Белый список вебхуков платежных систем (исключение из rate-limit)
map $request_uri $limit_req_exempt_key {
    default                  $binary_remote_addr;
    ~^/webhook/              "";
    ~^/.*webhook.*           "";
    ~^/platega-webhook       "";
    ~^/anypay-webhook        "";
    ~^/payment/anypay/notify "";
    ~^/aaio-webhook          "";
    ~^/payok-webhook         "";
    ~^/cryptomus-webhook     "";
    ~^/yookassa-webhook      "";
}

# 2. Зоны лимитов соединений и частоты запросов
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
limit_req_zone  $limit_req_exempt_key zone=req_limit:10m rate=15r/s;

# 3. Сокрытие версии Nginx
server_tokens off;

# 4. Защита от переполнения буферов (Buffer/Integer Overflow Protection)
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
client_body_buffer_size 16k;
client_max_body_size 10m;

# 5. Защитные таймауты против Slowloris
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          10s;
keepalive_timeout     30s;
reset_timedout_connection on;
